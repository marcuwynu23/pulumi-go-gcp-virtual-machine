name: CD - Pulumi GCP Virtual Machine (Destroy)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: GCP region
        required: true
        type: string
        default: us-central1
      zone:
        description: GCP zone
        required: true
        type: string
        default: us-central1-a
      instance_name:
        description: VM instance name
        required: true
        type: string
        default: free-tier-vm
      machine_type:
        description: VM machine type
        required: true
        type: string
        default: e2-micro
      ssh_user:
        description: SSH username
        required: true
        type: string
        default: gcp-user
      ssh_public_key:
        description: SSH public key content
        required: true
        type: string
      disk_size_gb:
        description: Boot disk size in GB
        required: true
        type: string
        default: "30"
      disk_type:
        description: Boot disk type
        required: true
        type: string
        default: pd-standard
      firewall_rules:
        description: Firewall rules (JSON)
        required: true
        type: string
        default: '[{"name": "allow-ssh", "direction": "INGRESS", "priority": 1000, "sourceRanges": ["0.0.0.0/0"], "allowed": [{"protocol": "tcp", "ports": ["22"]}]}]'
      backend_type:
        description: State backend (local, gcs, pulumi)
        required: true
        type: string
        default: local
      gcs_state_bucket:
        description: GCS bucket for state (if backend_type=gcs)
        required: false
        type: string
        default: ""

env:
  PULUMI_STACK: virtual-machine-${{ github.event.inputs.region }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  GCP_PROJECT: ${{ github.event.inputs.project_id }}
  GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

jobs:
  destroy:
    name: Pulumi Destroy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5
        with:
          command: version

      - name: Configure Pulumi Backend
        run: |
          if [ "${{ github.event.inputs.backend_type }}" = "local" ]; then
            pulumi login --local
            echo "Using local filesystem backend"
          elif [ "${{ github.event.inputs.backend_type }}" = "gcs" ]; then
            if [ -z "${{ github.event.inputs.gcs_state_bucket }}" ]; then
              echo "ERROR: gcs_state_bucket required for gcs backend"
              exit 1
            fi
            pulumi login gs://${{ github.event.inputs.gcs_state_bucket }}
            echo "Using GCS backend: gs://${{ github.event.inputs.gcs_state_bucket }}"
          else
            if [ -z "${{ secrets.PULUMI_ACCESS_TOKEN }}" ]; then
              echo "ERROR: PULUMI_ACCESS_TOKEN required for Pulumi Cloud backend"
              exit 1
            fi
            pulumi login --cloud-url https://api.pulumi.com
            echo "Using Pulumi Cloud backend"
          fi

      - name: Configure Pulumi Stack
        run: |
          pulumi stack select ${{ env.PULUMI_STACK }} 2>/dev/null || echo "Stack not found"

      - name: Set Pulumi Config
        run: |
          pulumi config set gcp:project ${{ github.event.inputs.project_id }}
          pulumi config set gcp:region ${{ github.event.inputs.region }}
          pulumi config set gcp:zone ${{ github.event.inputs.zone }}
          pulumi config set vm:instanceName ${{ github.event.inputs.instance_name }}
          pulumi config set vm:machineType ${{ github.event.inputs.machine_type }}
          pulumi config set vm:sshUser ${{ github.event.inputs.ssh_user }}
          pulumi config set --secret vm:sshPublicKey "${{ github.event.inputs.ssh_public_key }}"
          pulumi config set vm:diskSizeGb ${{ github.event.inputs.disk_size_gb }}
          pulumi config set vm:diskType ${{ github.event.inputs.disk_type }}
          pulumi config set vm:firewallRules '${{ github.event.inputs.firewall_rules }}'

      - name: Download Go Dependencies
        run: go mod download

      - name: Go Build
        run: go build -v .

      - name: Pulumi Preview (Destroy)
        run: |
          pulumi preview --stack ${{ env.PULUMI_STACK }} --destroy --yes

      - name: Pulumi Destroy
        run: |
          pulumi destroy --stack ${{ env.PULUMI_STACK }} --yes
name: pulumi-go-gcp-virtual-machine
description: Pulumi GCP Compute Engine VM with VPC, subnet, and firewall
runtime: go
config:
  gcp:project:
    description: The GCP Project ID
  gcp:region:
    description: The region to deploy to
    default: us-central1
  gcp:zone:
    description: The zone to deploy to
    default: us-central1-a
  vm:instanceName:
    description: The name of the VM instance
    default: free-tier-vm
  vm:machineType:
    description: The machine type for the VM
    default: e2-micro
  vm:sshUser:
    description: The SSH username to create on the VM
    default: gcp-user
  vm:sshPublicKey:
    description: The SSH public key content
    secret: true
  vm:diskSizeGb:
    description: The boot disk size in GB
    default: "30"
  vm:diskType:
    description: The boot disk type
    default: pd-standard
  vm:firewallRules:
    description: JSON list of firewall rules to create
    default: '[{"name": "allow-ssh", "direction": "INGRESS", "priority": 1000, "sourceRanges": ["0.0.0.0/0"], "allowed": [{"protocol": "tcp", "ports": ["22"]}]}]'

name: pulumi-go-gcp-virtual-machine
description: Pulumi GCP Compute Engine VM with VPC, subnet, and firewall
runtime: go
config:
  gcp:region:
    description: The region to deploy to
    value: us-central1
  gcp:zone:
    description: The zone to deploy to
    value: us-central1-a
  vm:instanceName:
    description: The name of the VM instance
    value: free-tier-vm
  vm:machineType:
    description: The machine type for the VM
    value: e2-micro
  vm:sshUser:
    description: The SSH username to create on the VM
    value: gcp-user
  vm:diskSizeGb:
    description: The boot disk size in GB
    value: '30'
  vm:diskType:
    description: The boot disk type
    value: pd-standard
  vm:firewallRules:
    description: JSON list of firewall rules to create
    value: '[{"name": "allow-ssh", "direction": "INGRESS", "priority": 1000, "sourceRanges": ["0.0.0.0/0"], "allowed": [{"protocol": "tcp", "ports": ["22"]}]}]'
